name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ember
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -W error
      - run: ruff check app tests
      - run: ruff format --check app tests

  image:
    name: Build and smoke-test image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (as the Supervisor does, but without its extra labels)
        run: >-
          docker buildx build ember
          --platform ${{ matrix.platform }}
          --build-arg BUILD_VERSION=ci
          --tag local/ember:ci
          --load
      - name: Start in dev mode and check the API
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name ember --platform ${{ matrix.platform }} \
            -e EMBER_DEV_MODE=1 -e EMBER_HOST=0.0.0.0 -v "$RUNNER_TEMP/data:/data" -p 8099:8099 local/ember:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8099/api/health && break
            sleep 2
          done
          expected=$(sed -n 's/^version: "\(.*\)"$/\1/p' ember/config.yaml)
          curl -fsS http://127.0.0.1:8099/api/health | grep -q "\"version\":\"$expected\""
          curl -fsS http://127.0.0.1:8099/api/dashboard > /dev/null
          curl -fsS http://127.0.0.1:8099/ | grep -q '<base href="/">'
          test -f "$RUNNER_TEMP/data/ember.db"
      - name: Without dev mode, direct connections are refused
        run: |
          docker run -d --name ember-strict --platform ${{ matrix.platform }} -p 8098:8099 local/ember:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          echo "expected 403, got $code"; exit 1
      - name: Container logs
        if: always()
        run: for c in ember ember-strict; do echo "== $c"; docker logs "$c" || true; done
