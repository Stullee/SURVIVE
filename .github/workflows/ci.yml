name: CI

on:
  push:
  pull_request:
  # 0.40.3: once a week on the default branch too, so a test that fails on a date shows before a release needs CI
  # (a test failed from 2026-10-28 on, analysis-0.40.1's codebase analysis, X1).
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ember
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # One worker per CPU (pytest-xdist): every test has its own data folder (tests/conftest.py).
      # 0.41.0: with line coverage and a floor under it (93.9% at 0.40.1, the codebase analysis of 0.40.1, 5.7).
      - run: python -m pytest -W error -n auto --cov=app --cov-report=term:skip-covered --cov-fail-under=92
      - run: ruff check app tests
      - run: ruff format --check app tests

  secrets:
    name: Secret scan
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Every commit, not only the newest: this repository is public, and a secret
          # removed in a later commit is still in its history.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      # gitleaks at a pinned version, built from its Go module (the Go checksum database verifies it).
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan every commit (rules in .gitleaks.toml, known old findings in .gitleaksignore)
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner .'

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 0.41.0: known vulnerabilities in the pinned dependencies (the codebase analysis of 0.40.1, 5.7). It reports and
    # doesn't block: a new advisory against a pin shouldn't stop a release on its own; bump the pin deliberately.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict --requirement ember/requirements.txt

  image:
    name: Build and smoke-test image (${{ matrix.platform }})
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (as the Supervisor does, but without its extra labels)
        run: >-
          docker buildx build ember
          --platform ${{ matrix.platform }}
          --build-arg BUILD_VERSION=ci
          --tag local/ember:ci
          --load
      - name: Make a PDF, Word, Excel and PNG file with the image's libraries
        run: >-
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 local/ember:ci
          -m app.products.selftest
      - name: Start in dev mode and check the API
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name ember --platform ${{ matrix.platform }} \
            -e EMBER_DEV_MODE=1 -e EMBER_HOST=0.0.0.0 -v "$RUNNER_TEMP/data:/data" -p 8099:8099 local/ember:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8099/api/health && break
            sleep 2
          done
          expected=$(sed -n 's/^version: "\(.*\)"$/\1/p' ember/config.yaml)
          curl -fsS http://127.0.0.1:8099/api/health | grep -q "\"version\":\"$expected\""
          curl -fsS http://127.0.0.1:8099/api/dashboard > /dev/null
          curl -fsS http://127.0.0.1:8099/ | grep -q '<base href="/">'
          test -f "$RUNNER_TEMP/data/ember.db"
      - name: Without dev mode, direct connections are refused
        run: |
          docker run -d --name ember-strict --platform ${{ matrix.platform }} -p 8098:8099 local/ember:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          echo "expected 403, got $code"; exit 1
      - name: Container logs
        if: always()
        run: for c in ember ember-strict; do echo "== $c"; docker logs "$c" || true; done
