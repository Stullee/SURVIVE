configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: >-
      Key from console.anthropic.com. Only needed when dry run is off. Stored by
      Home Assistant; Ember never logs or displays it.
  agent_name:
    name: Agent name
    description: What the agent calls itself.
  starting_balance_usd:
    name: Starting balance (USD)
    description: >-
      Your first grant to the agent, recorded once when it is born. Later
      grants are added from the dashboard.
  daily_spend_cap_usd:
    name: Daily spending cap (USD)
    description: Hard limit on API spending per day. Calls that could exceed it are refused.
  cycle_spend_cap_usd:
    name: Spending cap per wake cycle (USD)
    description: >-
      Hard limit on API spending in one wake cycle. Must not exceed the daily
      cap: if it does, Ember uses the daily cap and says so on the dashboard.
  venture_share:
    name: Share for ventures (%)
    description: >-
      This percent of each day's spending goes to venture cycles, where the
      agent researches new ways to earn beyond what it does now and brings you
      business cases on the Ventures tab. 0 switches venture cycles off.
  venture_cash_eur:
    name: Cash for a venture's first test (EUR)
    description: >-
      A business case that needs more cash than this to start is knocked out:
      Ember's code won't propose it until you override that on the Ventures
      tab.
  library_study_usd_per_day:
    name: Daily study budget for the library (USD)
    description: >-
      What the agent may spend a day studying the documents you add on the
      Library tab: it reads each one once and keeps what it learned. Counts
      toward the daily cap, not the cycle cap. 0: nothing is studied; the
      documents can still be searched and read.
  wake_interval_minutes:
    name: Default sleep between wake cycles (minutes)
    description: >-
      Used when the agent does not choose its own sleep time. Kept between the
      shortest and the longest sleep (the dashboard says so if it isn't).
  min_sleep_minutes:
    name: Shortest sleep (minutes)
    description: The agent can't choose to wake up sooner than this.
  max_sleep_minutes:
    name: Longest sleep (minutes)
    description: The agent can't choose to sleep longer than this.
  max_tool_steps:
    name: Tool steps per cycle
    description: Maximum number of tool calls the agent may make in one wake cycle.
  planner_model:
    name: Planner model
    description: >-
      Model that plans each cycle: what to work on and why, Ember's business
      decisions. claude-opus-5-5 decides better at about twice the price of a
      plan; it always thinks first, which Ember allows for. Must be listed in
      the price table.
  worker_model:
    name: Worker model
    description: >-
      Model that carries out the plan and writes the journal. Can be a cheaper
      model than the planner. Must be listed in the price table.
  strategy_model:
    name: Model for venture plans and reviews
    description: >-
      Optional. The model that plans the venture cycles, writes the daily
      review and critiques proposed ventures, where Ember decides what to
      pursue; empty, the planner model.
      claude-opus-5-5 here with claude-sonnet-5 as the planner puts the
      stronger model on those decisions only. It needs an entry in the price
      table (at most 100 characters).
  research_model:
    name: Research model
    description: >-
      Optional. A model for research (claude-haiku-4-5, say); empty, the
      worker model. It takes over only after a check: its first 10 research
      questions also go to the worker model, and it takes over if it found web
      pages for as many of them, less one. The System log says how the check
      came out. It needs an entry in the price table (at most 100
      characters).
  price_table:
    name: Price table
    description: >-
      Anthropic prices in USD per million tokens, used to compute costs and
      enforce the caps. Prices change; check them against Anthropic's pricing page.
    fields:
      model:
        name: Model ID
        description: Exact model ID, for example claude-sonnet-5.
      input:
        name: Input
        description: USD per million input tokens.
      output:
        name: Output
        description: USD per million output tokens.
      cache_write_5m:
        name: Cache write, 5 minutes
        description: USD per million tokens written to the 5-minute prompt cache.
      cache_write_1h:
        name: Cache write, 1 hour
        description: USD per million tokens written to the 1-hour prompt cache.
      cache_read:
        name: Cache read
        description: USD per million tokens read from the prompt cache.
  web_search_usd_per_1000:
    name: Web search price (USD per 1,000 searches)
    description: Charged by Anthropic on top of tokens for each web search.
  dry_run:
    name: Dry run
    description: >-
      On: the agent uses a built-in fake model and never calls the Anthropic
      API, so nothing costs money. Turn off only when you are ready.
  wake_on_message:
    name: Wake Ember when you write
    description: >-
      On: a message you send in the Inbox wakes the agent to read it, 5
      minutes after your last message or decision (at least 30 minutes
      after the last such wake), so one cycle reads them all. Off: it reads your message at its next scheduled wake-up.
  wake_on_decision:
    name: Wake Ember when you decide
    description: >-
      On: your decision on one of its requests (approve, reject, done), on a
      venture or on a milestone wakes the agent to act on it, like a message
      does. Off: it sees your decision at its next scheduled wake-up.
  wake_on_events:
    name: Wake Ember for events
    description: >-
      On: a reply to Ember's email, a new email from a person or the last day
      of a milestone Ember's code doesn't check wakes the agent for a short
      cycle (at most 4 a day). Off: they wait for its next scheduled wake-up.
  worker_effort:
    name: Worker effort
    description: >-
      How thoroughly the model works in each step. Lower effort writes shorter
      answers and uses fewer tool calls, which costs less, but may do a worse
      job. "default" is the model's own default (high). Not used for Haiku.
  workshop:
    name: Workshop (run code in Anthropic's sandbox)
    description: >-
      On: when its own tools can't make something (a chart, a PowerPoint
      file, data work), the agent can have code written and run in Anthropic's
      code execution sandbox, which has no internet access. Nothing runs on
      your Home Assistant. The files it makes are checked before they are kept.
  workshop_model:
    name: Workshop model
    description: >-
      The model that writes the workshop's code. Empty: the worker model.
      claude-opus-5-5 writes better code at twice the price per token. It
      needs an entry in the price table (at most 100 characters).
  workshop_run_cap_usd:
    name: Workshop cap per run (USD)
    description: >-
      The most one workshop run may be priced at, and what Ember keeps of
      the daily cap for each run (more after costlier runs). Runs count
      toward the daily cap, not the cycle cap.
  workshop_runs_per_day:
    name: Workshop runs per day
    description: At most this many workshop runs a day (0 switches the workshop off).
  code_execution_usd_per_hour:
    name: Sandbox price (USD per hour)
    description: >-
      What Anthropic charges per hour of sandbox time beyond its free hours
      (1,550 a month per organization). Ember books at least 5 minutes per run
      at this price, so its books never show less than you may pay.
  web_fetch:
    name: Let the agent read whole web pages
    description: >-
      Off: the agent can only search the web. On: it can also read pages it
      found. PDFs have no size limit, so one read can cost more than the
      per-cycle cap before the budget guard notices and stops the cycle.
  kill_switch_reset:
    name: Kill switch reset
    description: >-
      The kill switch on the dashboard stops the agent for good. To let it run
      again, change this number to any other value and restart the app.
  owner_user_ids:
    name: Owner user IDs
    description: >-
      The Home Assistant user IDs of Ember's owner: only these users can use
      Ember's dashboard, its actions and its diagnostics. Empty: everyone who can
      open the panel counts as the owner, and the dashboard shows your ID to put
      here. Restart the app after changing it. Each ID has at most 100
      characters.
  log_level:
    name: Log level
    description: How much detail goes to the app log.
  email_enabled:
    name: Ember's mailbox
    description: >-
      On: Ember reads its own mailbox and may propose emails; each one is sent
      by Ember only after you approve it. Needs the address, app password and
      your name below.
  email_address:
    name: Mailbox address
    description: The address of the mailbox you created for Ember, for example ember-yourname@mailbox.org.
  email_password:
    name: Mailbox app password
    description: >-
      An app password limited to IMAP and SMTP (not your main password).
      Stored by Home Assistant; Ember never logs or displays it.
  email_imap_host:
    name: IMAP server
    description: Where Ember reads its mail (always over TLS).
  email_imap_port:
    name: IMAP port
    description: Usually 993 (TLS).
  email_smtp_host:
    name: SMTP server
    description: Where Ember sends the emails you approved.
  email_smtp_port:
    name: SMTP port
    description: 465 (TLS) or 587 (STARTTLS); other ports are refused.
  email_owner_name:
    name: Your name for emails
    description: >-
      Named in the sender and in the footer of every email Ember sends
      ("Ember (AI agent of <your name>)").
  email_daily_limit:
    name: Emails per day
    description: The most emails Ember sends in one day (0 to 20). Approved emails beyond it wait for the next day.
  etsy_enabled:
    name: Etsy shop
    description: >-
      On: Ember can propose listings for your Etsy shop, and after you approve
      one, Ember's code creates it through your own Etsy app. Needs the
      keystring and shared secret below and a one-time connection in the
      dashboard (System, Etsy). See the Documentation tab.
  etsy_keystring:
    name: Etsy app keystring
    description: >-
      The keystring of the app you registered at etsy.com/developers for your
      shop (at most 100 characters).
  etsy_shared_secret:
    name: Etsy app shared secret
    description: >-
      The shared secret of that app. Stored by Home Assistant; Ember never
      logs or displays it.
  etsy_redirect_uri:
    name: Etsy redirect URI
    description: >-
      The callback URL registered for your Etsy app, exactly as there. It
      doesn't need to open anything: you copy the address Etsy sends you to
      back into the dashboard.
  etsy_listings_per_day:
    name: Etsy listings per day
    description: >-
      The most listings Ember creates in one day (0 to 20). Each costs Etsy's
      listing fee (USD 0.20); approved listings beyond it wait for the next
      day.
  etsy_stats_history:
    name: Keep a history of the listings' numbers
    description: >-
      On: every day Ember keeps your listings' views and favorites, so its plans
      see how each one changed. Etsy's API terms limit how long its content may
      be kept: turn this on only once you have confirmed that they allow this
      history of your own listings.
  etsy_auto_renew_sold:
    name: Renew listings that sell
    description: >-
      On: once one of Ember's listings has sold, Ember turns on Etsy's
      automatic renewal for it, so it doesn't expire after four months (Etsy
      charges its listing fee, USD 0.20, at each renewal). Ember does this once
      per listing: if you turn it off at Etsy afterwards, that stands.
  etsy_auto_record_revenue:
    name: Record Etsy revenue automatically
    description: >-
      On: at each Etsy sync, Ember's code records the revenue of paid orders
      of Ember's listings placed from the day you turn it on, Etsy's fees on
      them, their refunds and what Printify bills for its orders in the ledger
      (shown as made by Ember's code), so its balance and goals see them
      without waiting for you. Off: you record
      them (System, Etsy). Entries you made stay yours.
  etsy_usd_per_eur:
    name: Exchange rate for Etsy revenue (USD per 1 EUR)
    description: >-
      The rate Ember's code uses for orders in EUR when it records them
      automatically, for example 1.08. 0: orders in EUR are left for you to
      record (a rate below 0.5 counts as 0).
  etsy_market_probe:
    name: Etsy market probe for demand notes
    description: >-
      On: before a new product line's first listing, Ember's demand note reads
      Etsy's search of active listings for its keywords and keeps only how
      many match and their price quartiles. Turn it on only once you have
      confirmed that Etsy's API terms allow this use; otherwise add a keyword
      export to the Library each week.
  pinterest_enabled:
    name: Pinterest
    description: >-
      Let Ember propose pins that bring buyers to your Etsy shop, from your
      Pinterest account. Each pin waits for your approval; your first board
      always does. Connect the account in the dashboard (System, Pinterest).
      In dry run a fake account stands in.
  pinterest_app_id:
    name: Pinterest app ID
    description: >-
      The ID of the app you created for your own account at
      developers.pinterest.com (at most 100 characters).
  pinterest_app_secret:
    name: Pinterest app secret
    description: >-
      The secret of that app. Stored by Home Assistant; Ember never logs or
      displays it.
  pinterest_redirect_uri:
    name: Pinterest redirect URI
    description: >-
      The redirect URI registered for your Pinterest app, exactly as there. It
      doesn't need to open: after you allow access, copy the address your
      browser shows into the dashboard.
  pinterest_pins_per_day:
    name: Pins per day
    description: >-
      At most this many approved pins a day; more wait for the next day.
  printify_enabled:
    name: Printify
    description: >-
      Let Ember propose physical products with its designs (posters, mugs,
      journals), made on order by Printify and sold in your Etsy shop through
      Printify's Etsy connection. Each product waits for your approval; the
      first one always does. In dry run a fake account stands in.
  printify_api_token:
    name: Printify personal access token
    description: >-
      A token you create in Printify (My profile, Connections) with access to
      shops, catalog, products, orders and uploads. Stored by Home Assistant;
      Ember never logs or displays it.
  printify_shop_id:
    name: Printify shop
    description: >-
      The Printify shop connected to your Etsy shop. 0: the only one that is.
  printify_currency:
    name: Printify currency
    description: >-
      The currency of the prices and costs Printify shows for that shop.
  printify_products_per_day:
    name: Printify products per day
    description: >-
      At most this many approved products are created a day; more wait for
      the next day.
  printify_buyer_pays_shipping:
    name: Buyers pay Printify shipping
    description: >-
      On if your Etsy shipping profile for Printify's products charges the
      buyer for shipping. Off: Ember prices as if the price alone pays it.
  printify_bill_vat:
    name: Printify bills VAT
    description: >-
      On if Printify adds VAT to its bill and you can't reclaim it (for
      example as a Kleinunternehmer). Used for the margin check.
  site_enabled:
    name: Website
    description: >-
      Let the agent write the pages of a small website of yours. Ember's code
      builds it in one fixed design without scripts, cookies or trackers, with
      an Impressum and a privacy page made from the options below. You preview
      it, download it and publish it yourself: Ember never does.
  site_name:
    name: Website name
    description: >-
      The site's name in its header, e.g. your shop's name (at most 60
      characters). Empty: your name.
  site_language:
    name: Website language
    description: >-
      The language of the pages the agent writes (the Impressum and the
      privacy page are German).
  site_url:
    name: Website address
    description: >-
      Where you publish it, e.g. https://example.org: for its sitemap and the
      search engines. Optional. An https address with at most a path (no ?, no
      #); a domain with umlauts in its xn-- form.
  site_owner_name:
    name: Your full name (Impressum)
    description: >-
      Your name, or your business's with its legal form, as the Impressum
      (§ 5 DDG) requires (at most 100 characters).
  site_address:
    name: Your address (Impressum)
    description: >-
      A postal address you can be reached at: street, then postcode and town,
      separated by a comma (a P.O. box isn't enough; at most 300 characters).
  site_email:
    name: Your email address (Impressum)
    description: >-
      An address people can write to, like shop@example.org (at most 254
      characters); the website shows it.
  site_phone:
    name: Your phone number (Impressum)
    description: >-
      Optional: shown in the Impressum if set.
  site_vat_id:
    name: Your VAT ID (Impressum)
    description: >-
      Optional: your Umsatzsteuer-Identifikationsnummer, if you have one.
  site_host:
    name: Your web host (privacy page)
    description: >-
      Optional: the name and address of the company that hosts your website,
      e.g. 'Strato AG, Otto-Ostrowski-Straße 7, 10249 Berlin' (at most 200
      characters). The privacy page names it.
