[pytest]
testpaths = tests
pythonpath = .
# 0.41.0: warnings are errors and markers must be declared locally too, as in CI (the codebase analysis of 0.40.1, 5.7).
addopts = -q --strict-markers
filterwarnings =
    error
markers =
    exploring: the plan lays out its Ventures, so their steps make venture cycles; turns=True: with the turns they take with a new product (0.36.0)
