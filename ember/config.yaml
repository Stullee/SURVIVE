# https://developers.home-assistant.io/docs/apps/configuration
# Home Assistant calls these "apps" since 2026.2 (formerly "add-ons"); the file format is unchanged.
name: Ember
version: "0.13.0"
slug: ember
description: A self-sustaining AI agent that has to earn more than its API calls cost.
url: "https://github.com/Stullee/SURVIVE"
arch:
  - aarch64
  - amd64
# s6-overlay v3 in the base image must run as PID 1.
init: false
startup: application
boot: auto

# The dashboard is only served through Home Assistant Ingress.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: Ember

# Least privilege: no Home Assistant or Supervisor API, no host network, no
# extra folders (/data is always mapped and holds everything Ember keeps).
homeassistant_api: false
hassio_api: false
host_network: false

# Stop the app while Home Assistant takes a backup, so the SQLite database in
# /data is copied in a consistent state.
backup: cold

watchdog: "http://[HOST]:[PORT:8099]/api/health"

options:
  agent_name: Ember
  starting_balance_usd: 20
  daily_spend_cap_usd: 1.5
  cycle_spend_cap_usd: 0.5
  venture_share: 25
  venture_cash_eur: 20
  library_study_usd_per_day: 0.5
  wake_interval_minutes: 240
  min_sleep_minutes: 30
  max_sleep_minutes: 1440
  max_tool_steps: 15
  planner_model: claude-sonnet-5
  worker_model: claude-sonnet-5
  # USD per million tokens. Check https://platform.claude.com/docs/en/about-claude/pricing
  price_table:
    - model: claude-sonnet-5
      input: 2
      output: 10
      cache_write_5m: 2.5
      cache_write_1h: 4
      cache_read: 0.2
    - model: claude-opus-5-5
      input: 4
      output: 20
      cache_write_5m: 5
      cache_write_1h: 8
      cache_read: 0.2
    - model: claude-haiku-4-5
      input: 1
      output: 5
      cache_write_5m: 1.25
      cache_write_1h: 2
      cache_read: 0.1
  web_search_usd_per_1000: 10
  dry_run: true
  web_fetch: false
  wake_on_message: true
  wake_on_decision: true
  worker_effort: default
  # The workshop: code the agent has written, run in Anthropic's sandbox (see the Documentation tab). Its model
  # (workshop_model) is an optional option: empty, the worker model writes the code.
  workshop: true
  workshop_run_cap_usd: 0.75
  workshop_runs_per_day: 6
  code_execution_usd_per_hour: 0.05
  # Change this number (and restart) to re-enable an agent stopped with the kill switch.
  kill_switch_reset: 0
  # Your Home Assistant user ID: only the users listed here can use Ember (see the Documentation tab). Empty: everyone
  # who can open the panel counts as the owner, and the dashboard shows your ID.
  owner_user_ids: []
  log_level: info
  # Ember's own mailbox (see the Documentation tab). The address, the app password and your name are
  # optional options: turn on "Show unused optional configuration options" to fill them in.
  email_enabled: false
  email_imap_host: imap.mailbox.org
  email_imap_port: 993
  email_smtp_host: smtp.mailbox.org
  email_smtp_port: 465
  email_daily_limit: 3
  # Etsy (see the Documentation tab): your Etsy app's keystring and shared secret are optional options too.
  etsy_enabled: false
  etsy_redirect_uri: https://localhost/ember-etsy
  etsy_listings_per_day: 3
  # A daily history of your listings' views and favorites. Turn it on once you have confirmed that Etsy's API terms
  # allow keeping it (see the Documentation tab).
  etsy_stats_history: false
  # Etsy's automatic renewal (USD 0.20 every four months) for a listing once it has sold.
  etsy_auto_renew_sold: true
  # Record the revenue of Ember's Etsy orders, Etsy's fees and refunds in the ledger yourself, or let Ember's code do
  # it at each sync for the orders from the day you turn it on (see the Documentation tab). EUR amounts need your
  # exchange rate: USD per 1 EUR (0.5 to 3; 0: none).
  etsy_auto_record_revenue: false
  etsy_usd_per_eur: 0
  # A demand note reads Etsy's search of active listings for its keywords: how many match and their price quartiles,
  # nothing else kept. Turn it on once you have confirmed that Etsy's API terms allow this use; otherwise add a keyword
  # export to the Library each week (see the Documentation tab).
  etsy_market_probe: false
  # Pinterest (see the Documentation tab): pins that bring buyers to your Etsy shop, from your account. Your
  # Pinterest app's id and secret are optional options too.
  pinterest_enabled: false
  pinterest_redirect_uri: https://localhost/ember-pinterest
  pinterest_pins_per_day: 3
  # Printify (see the Documentation tab): physical products with Ember's designs, made on order and sold in your Etsy
  # shop through Printify's Etsy connection. Your personal access token is an optional option too.
  printify_enabled: false
  printify_shop_id: 0
  printify_currency: EUR
  printify_products_per_day: 2
  # Your website (see the Documentation tab): pages the agent writes, built by Ember into a static site that you
  # preview, download and publish yourself. Your name, address, email, phone, VAT ID and web host for its Impressum
  # and privacy page, its name and its address are optional options too.
  site_enabled: false
  site_language: de

schema:
  anthropic_api_key: password?
  agent_name: str(1,40)
  starting_balance_usd: float(0,100000)
  daily_spend_cap_usd: float(0,1000)
  cycle_spend_cap_usd: float(0,1000)
  venture_share: int(0,100)
  venture_cash_eur: float(0,100000)
  library_study_usd_per_day: float(0,100)
  wake_interval_minutes: int(5,10080)
  min_sleep_minutes: int(5,10080)
  max_sleep_minutes: int(5,10080)
  max_tool_steps: int(1,100)
  planner_model: str(1,100)
  worker_model: str(1,100)
  price_table:
    - model: str(1,100)
      input: float(0.000001,1000)
      output: float(0.000001,1000)
      cache_write_5m: float(0.000001,1000)
      cache_write_1h: float(0.000001,1000)
      cache_read: float(0.000001,1000)
  web_search_usd_per_1000: float(0.000001,1000)
  dry_run: bool
  web_fetch: bool
  wake_on_message: bool
  wake_on_decision: bool
  worker_effort: list(default|high|medium|low)
  workshop: bool
  workshop_model: str?
  strategy_model: str?
  research_model: str?
  workshop_run_cap_usd: float(0.05,100)
  workshop_runs_per_day: int(0,50)
  code_execution_usd_per_hour: float(0,100)
  kill_switch_reset: int(0,1000000)
  owner_user_ids:
    - str
  log_level: list(debug|info|warning|error)
  email_enabled: bool
  email_address: str?
  email_password: password?
  email_imap_host: str
  email_imap_port: int(1,65535)
  email_smtp_host: str
  email_smtp_port: int(1,65535)
  email_owner_name: str?
  email_daily_limit: int(0,20)
  etsy_enabled: bool
  etsy_keystring: str?
  etsy_shared_secret: password?
  etsy_redirect_uri: str(1,300)
  etsy_listings_per_day: int(0,20)
  etsy_stats_history: bool
  etsy_auto_renew_sold: bool
  etsy_auto_record_revenue: bool
  etsy_usd_per_eur: float(0,3)
  etsy_market_probe: bool
  pinterest_enabled: bool
  pinterest_app_id: str?
  pinterest_app_secret: password?
  pinterest_redirect_uri: str(1,300)
  pinterest_pins_per_day: int(0,20)
  printify_enabled: bool
  printify_api_token: password?
  printify_shop_id: int(0,999999999999)
  printify_currency: list(EUR|USD|GBP)
  printify_products_per_day: int(0,10)
  site_enabled: bool
  site_name: str?
  site_language: list(de|en)
  site_url: url?
  site_owner_name: str?
  site_address: str?
  site_email: email?
  site_phone: str?
  site_vat_id: str?
  site_host: str?
